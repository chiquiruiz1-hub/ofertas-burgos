name: Generar Excel ofertas Burgos

on:
  schedule:
    # Varios intentos cada madrugada por si GitHub se salta alguno:
    # cada media hora, a los minutos 17 y 47, de 02:17 a 06:47 UTC
    # (= 03:17 a 07:47 hora de Burgos en invierno). Si el Excel de hoy ya
    # está hecho, los siguientes intentos no hacen nada.
    - cron: "17,47 2-6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ofertas.yml"
      - "generar_excel.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python generar_excel.py
      - name: Guardar Excel en el repositorio
        run: |
          git config user.name "ofertas-bot"
          git config user.email "ofertas-bot@users.noreply.github.com"
          git add Burgos_Ofertas.xlsx
          git commit -m "Ofertas Burgos $(date -u +%F)" || echo "sin cambios"
          git push
